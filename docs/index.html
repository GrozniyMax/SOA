<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOA Lab — OpenAPI Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .topbar {
      background: #1b1b1b;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .topbar h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .topbar .spacer { flex: 1; }
    .topbar select {
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #2b2b2b;
      color: #fff;
    }
    #swagger-ui { padding: 0 20px 40px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>SOA Lab — REST API</h1>
    <div class="spacer"></div>
    <label for="spec-select" style="font-size:14px; color:#ccc;">Спецификация:</label>
    <select id="spec-select">
      <option value="../openapi/movie-service.yaml">Movie Collection Service</option>
      <option value="../openapi/oscar-service.yaml">Oscar Service</option>
    </select>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    const ui = SwaggerUIBundle({
      url: '../openapi/movie-service.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: 'BaseLayout',
    });

    document.getElementById('spec-select').addEventListener('change', (e) => {
      ui.specActions.updateUrl(e.target.value);
      ui.specActions.download(e.target.value);
    });
  </script>
</body>
</html>
