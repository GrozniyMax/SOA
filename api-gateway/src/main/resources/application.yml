spring:
  application:
    name: api-gateway

server:
  port: ${SERVER_PORT:8443}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka}

zuul:
  routes:
    movie-service:
      path: /movie-service/**
      service-id: MOVIE-SERVICE
    oscar-service:
      path: /oscar/**
      url: ${OSCAR_URL:http://haproxy:9090/oscar}
