spring:
  application:
    name: api-gateway

server:
  port: ${SERVER_PORT:8443}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka}

zuul:
  ignore-local-service: false
  routes:
    movie-service:
      path: /movie-service/**
      service-id: MOVIE-SERVICE
    oscar:
      path: /oscar/**
      url: http://haproxy:9090/oscar

ribbon:
  eureka:
    enabled: true
