# Bootstrap-контекст (Boot 2.3 / Hoxton: без spring.config.import — имя и адрес
# Config Server задаётся здесь, до загрузки основного application.yml).
spring:
  application:
    name: oscar-service
  cloud:
    config:
      uri: ${CONFIG_URL:http://localhost:8888}
      # Без config-server сервис обязан стартовать (локальная разработка).
      # ВАЖНО: флаг override-none в Hoxton читается из remote-конфига самим
      # клиентом (bind по temp-Environment из remote-источников), поэтому он
      # задан в config-repo/application.yml на стороне config-server.
      fail-fast: false
