# Локальный профиль для разработки: in-memory H2, схема создаётся/удаляется автоматически.
spring:
  datasource:
    url: jdbc:h2:mem:oscar;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false