# spring.application.name перенесён в bootstrap.yml (bootstrap-контекст Boot 2.3).
spring:
  datasource:
    url: ${OSCAR_DB_URL:jdbc:postgresql://localhost:5432/oscar}
    username: ${OSCAR_DB_USERNAME:oscar}
    password: ${OSCAR_DB_PASSWORD:oscar}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  cloud:
    loadbalancer:
      ribbon:
        enabled: false
      cache:
        enabled: false

server:
  # Порт локально из env (remote-конфиг ниже приоритетом).
  port: ${OSCAR_PORT:8081}
  servlet:
    context-path: /oscar

instance:
  id: ${INSTANCE_ID:1}

eureka:
  client:
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    instance-id: ${spring.application.name}:${instance.id}
    prefer-ip-address: true

# По умолчанию Feign ищет movie-service в Eureka. Явный URL нужен для локального запуска.
movie:
  service:
    url: ${MOVIE_SERVICE_URL:}
    path: ${MOVIE_SERVICE_PATH:}
    truststore: ${MOVIE_SERVICE_TRUSTSTORE:}
    truststore-password: ${MOVIE_SERVICE_TRUSTSTORE_PASSWORD:}
  # Размер пачки режиссёров в одном запросе POST /movies/directors/humiliate.
  humiliate:
    batch-size: ${MOVIE_HUMILIATE_BATCH_SIZE:10}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
