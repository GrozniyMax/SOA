openapi: 3.0.3
info:
  title: Movie Collection Service
  description: |
    Веб-сервис управления коллекцией объектов Movie.

    Поддерживает базовый набор операций с коллекцией (добавление, получение по ИД,
    обновление, удаление, получение массива), сортировку/фильтрацию по любой комбинации
    полей и постраничный вывод, а также дополнительные операции над коллекцией.

  version: 1.0.0
  contact:
    name: SOA Lab
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /
    description: Локальный сервер коллекции Movie
security: []
tags:
  - name: Movies
    description: Операции над коллекцией объектов Movie
paths:
  /movies:
    post:
      tags:
        - Movies
      operationId: addMovie
      summary: Добавить новый элемент в коллекцию
      description: |
        Добавляет новый объект Movie в коллекцию. Поля `id` и `creationDate`
        генерируются сервисом автоматически и не должны передаваться в запросе.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieRequest'
      responses:
        '201':
          description: Объект успешно создан
          headers:
            Location:
              description: URL созданного объекта
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /movies/search:
    post:
      tags:
        - Movies
      operationId: searchMovies
      summary: Получить массив элементов коллекции (фильтр в теле запроса)
      description: |
        Возвращает выборку объектов Movie: фильтры, сортировка и параметры страницы
        передаются в теле запроса. 

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieSearchRequest'
      responses:
        '200':
          description: Успешная выборка элементов коллекции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /movies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ИД объекта Movie (целое число больше 0)
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - Movies
      operationId: getMovieById
      summary: Получить элемент коллекции по ИД
      responses:
        '200':
          description: Объект найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Movies
      operationId: updateMovie
      summary: Обновить элемент коллекции по ИД
      description: |
        Полностью обновляет объект Movie с указанным ИД. Поля `id` и `creationDate`
        не изменяются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieRequest'
      responses:
        '200':
          description: Объект успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Movies
      operationId: deleteMovie
      summary: Удалить элемент коллекции по ИД
      responses:
        '204':
          description: Объект успешно удалён (тело ответа отсутствует)
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /movies/by-max-tagline:
    get:
      tags:
        - Movies
      operationId: getMovieWithMaxTagline
      summary: Вернуть один (любой) объект с максимальным значением tagline
      description: |
        Возвращает один произвольный объект Movie, значение поля `tagline` которого
        является максимальным среди всех объектов коллекции.
      responses:
        '200':
          description: Объект с максимальным tagline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '404':
          $ref: '#/components/responses/NoMovieWithTagline'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /movies/by-directors-greater-than:
    get:
      tags:
        - Movies
      operationId: getMoviesByDirectorGreaterThan
      summary: Вернуть массив объектов, значение director которых больше заданного
      description: |
        Возвращает массив объектов Movie, значение поля `director` которых больше
        заданного. Сравнение режиссёров выполняется по имени (director.name).
      parameters:
        - name: director
          in: query
          required: true
          description: Значение для сравнения (имя режиссёра)
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Страница объектов, удовлетворяющих условию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /movies/genres:
    get:
      tags:
        - Movies
      operationId: getUniqueGenres
      summary: Вернуть массив уникальных значений поля genre
      description: |
        Возвращает массив уникальных значений поля `genre` по всем объектам коллекции.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Страница уникальных жанров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenrePage'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Movie:
      type: object
      description: Объект коллекции Movie
      required:
        - id
        - name
        - coordinates
        - creationDate
        - genre
        - director
      properties:
        id:
          type: integer
          format: int32
          description: Уникальный ИД, генерируется автоматически, должен быть больше 0
          minimum: 1
          readOnly: true
        name:
          type: string
          description: Название фильма, не может быть null или пустой строкой
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date-time
          description: Дата создания записи, генерируется автоматически
          readOnly: true
        oscarsCount:
          type: integer
          format: int32
          description: Количество Оскаров, может быть null, должно быть больше 0
          minimum: 1
          nullable: true
        totalBoxOffice:
          type: number
          format: float
          description: Общие кассовые сборы, может быть null, должно быть больше 0
          minimum: 0
          exclusiveMinimum: true
          nullable: true
        tagline:
          type: string
          description: Слоган, может быть null, длина не больше 181
          maxLength: 181
          nullable: true
        genre:
          $ref: '#/components/schemas/MovieGenre'
        director:
          $ref: '#/components/schemas/Person'
    MovieRequest:
      type: object
      description: Запрос на создание/обновление объекта Movie (без авто-полей)
      required:
        - name
        - coordinates
        - genre
        - director
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        oscarsCount:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        totalBoxOffice:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          nullable: true
        tagline:
          type: string
          maxLength: 181
          nullable: true
        genre:
          $ref: '#/components/schemas/MovieGenre'
        director:
          $ref: '#/components/schemas/Person'
    MovieSearchRequest:
      type: object
      description: |
        Фильтры, сортировка и параметры страницы для POST /movies/search.
        Все поля необязательные: без фильтров возвращается вся коллекция.
      properties:
        filters:
          type: array
          description: Условия фильтрации, объединяются через И
          items:
            $ref: '#/components/schemas/MovieFilter'
        sort:
          type: string
          description: Поля сортировки с направлением через запятую, как в GET /movies
          example: name:asc,oscarsCount:desc
        page:
          type: integer
          minimum: 0
          default: 0
          description: Порядковый номер страницы (начиная с 0)
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Размер страницы
    MovieFilter:
      type: object
      description: Одно условие фильтрации
      required:
        - path
        - value
      properties:
        path:
          $ref: '#/components/schemas/MovieFieldPath'
        value:
          type: string
          description: Значение для сравнения в строковом виде, например `DRAMA` или `4`
          example: DRAMA
        comparator:
          $ref: '#/components/schemas/Comparator'
    MovieFieldPath:
      type: string
      description: Путь до поля объекта Movie, по которому выполняется фильтрация
      enum:
        - id
        - name
        - coordinates.x
        - coordinates.y
        - creationDate
        - oscarsCount
        - totalBoxOffice
        - tagline
        - genre
        - director.name
        - director.birthday
        - director.eyeColor
        - director.hairColor
    Coordinates:
      type: object
      description: Координаты фильма
      required:
        - x
        - y
      properties:
        x:
          type: integer
          format: int32
        y:
          type: number
          format: float
    Person:
      type: object
      description: Режиссёр фильма
      required:
        - name
      properties:
        name:
          type: string
          description: Имя, не может быть null или пустой строкой
          minLength: 1
        birthday:
          type: string
          format: date-time
          description: Дата рождения, может быть null
          nullable: true
        eyeColor:
          $ref: '#/components/schemas/EyeColor'
        hairColor:
          $ref: '#/components/schemas/HairColor'
    MovieGenre:
      type: string
      description: Жанр фильма
      enum:
        - ACTION
        - DRAMA
        - ADVENTURE
        - FANTASY
    EyeColor:
      type: string
      description: Цвет глаз
      enum:
        - GREEN
        - BLACK
        - BLUE
    HairColor:
      type: string
      description: Цвет волос
      enum:
        - RED
        - BLACK
        - ORANGE
        - BROWN
    Comparator:
      type: string
      description: |
        Оператор сравнения для фильтрации.
        По умолчанию (если поле не указано) используется `eq`.
      default: eq
      enum:
        - gt
        - lt
        - eq
        - substring
    Page:
      type: object
      description: |
        Обобщённая страница результатов выборки. Переиспользуется через `allOf`
        конкретными страницами (например, `MoviePage`), которые уточняют тип
        элементов поля `items`.
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          description: Элементы текущей страницы
        total:
          type: integer
          format: int64
          description: Общее количество элементов, удовлетворяющих условиям выборки
          minimum: 0
        page:
          type: integer
          format: int32
          description: Порядковый номер текущей страницы
          minimum: 0
        size:
          type: integer
          format: int32
          description: Размер страницы
          minimum: 1
    MoviePage:
      description: Страница результатов с объектами Movie
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Movie'
    GenrePage:
      description: Страница результатов с уникальными жанрами
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MovieGenre'
    ApiError:
      type: object
      description: Описание ошибки
      required:
        - status
        - message
      properties:
        status:
          type: integer
          format: int32
          description: HTTP-код ответа
        message:
          type: string
          description: Текстовое описание ошибки
  parameters:
    PageParam:
      name: page
      in: query
      description: Порядковый номер страницы (начиная с 0)
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      description: Размер страницы
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Некорректный запрос — невалидные параметры или некорректный формат данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotAcceptable:
      description: Клиент указал в заголовке Accept формат, отличный от application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: Тело запроса передано не в формате application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Данные не прошли проверку ограничений целостности (пустое name, oscarsCount <= 0, tagline длиннее 181 и т.п.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Объект с указанным ИД не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NoMovieWithTagline:
      description: В коллекции нет ни одного фильма с непустым tagline
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'