# Конфигурация oscar-service, внешняя часть (Production/контейнерный запуск).
# Приоритет remote PropertySource ниже локального application.yml:
# здесь — сервер/контекст-путь, PostgreSQL, параметры movie-service и CORS;
# локально в сервисе остаются только имя, spring.config.import и dev-профиль (H2).
# INSTANCE_ID — идентификатор конкретного инстанса, задаётся per-instance через env.
server:
  port: ${OSCAR_PORT:8081}
  servlet:
    context-path: /oscar

spring:
  datasource:
    url: ${OSCAR_DB_URL:jdbc:postgresql://localhost:5432/oscar}
    username: ${OSCAR_DB_USERNAME:oscar}
    password: ${OSCAR_DB_PASSWORD:oscar}

movie:
  service:
    url: ${MOVIE_SERVICE_URL:http://localhost:8080}
    truststore: ${MOVIE_SERVICE_TRUSTSTORE:}
    truststore-password: ${MOVIE_SERVICE_TRUSTSTORE_PASSWORD:}
  # Размер пачки режиссёров в одном запросе POST /movies/directors/humiliate.
  humiliate:
    batch-size: ${MOVIE_HUMILIATE_BATCH_SIZE:10}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

instance:
  id: ${INSTANCE_ID:}
