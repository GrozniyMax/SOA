# Общая конфигурация для всех клиентов Config Server.
# Отдаётся как remote PropertySource с приоритетом НИЖЕ локального application.yml сервиса:
# здесь — только внешние (прод-like) значения, реальные значения приходят через env
# при запуске в контейнерах; локальный dev-профиль (H2) целиком живёт в сервисе.
spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
