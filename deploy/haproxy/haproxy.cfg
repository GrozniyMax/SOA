# Roundrobin-балансировка между двумя инстансами oscar-service.
# Дешёвого GET-эндпоинта у oscar нет (/operators/losers зовёт movie через gateway),
# поэтому health-check — TCP.
global
    log stdout format raw local0

# Контейнеры oscar при пересоздании меняют IP — резолвим имена через
# docker-DNS, иначе haproxy навсегда держит устаревший адрес.
# (hold down в haproxy 3.x не поддерживается — только valid/other/refused/nx/timeout.)
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s

defaults
    mode http
    log global
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend oscar_frontend
    bind *:9090
    default_backend oscars

backend oscars
    balance roundrobin
    server oscar-1 oscar-1:8081 check resolvers docker init-addr libc,none
    server oscar-2 oscar-2:8082 check resolvers docker init-addr libc,none

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
