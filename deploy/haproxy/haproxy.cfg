# Roundrobin между экземплярами Oscar из Eureka с TCP-проверками.
global
    log stdout format raw local0

resolvers eureka_dns
    nameserver eureka tcp@discovery-dns:8053
    accepted_payload_size 4096
    hold valid 5s
    hold obsolete 0s
    hold nx 5s

defaults
    mode http
    log global
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend oscar_frontend
    bind *:9090
    default_backend oscars

backend oscars
    balance roundrobin
    server-template oscar 10 _oscar._tcp.discovery.internal resolvers eureka_dns check init-addr none

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
