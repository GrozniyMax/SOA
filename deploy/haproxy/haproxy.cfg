# Roundrobin-балансировка между двумя инстансами oscar-service.
# Дешёвого GET-эндпоинта у oscar нет (/operators/losers зовёт movie через gateway),
# поэтому health-check — TCP.
global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend oscar_frontend
    bind *:9090
    default_backend oscars

backend oscars
    balance roundrobin
    server oscar-1 oscar-1:8081 check inter 5s fall 3 rise 2
    server oscar-2 oscar-2:8082 check inter 5s fall 3 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
