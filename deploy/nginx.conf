# Frontend (nginx, TLS :8444) — единственная точка входа браузера.
# Статика Vite-сборки + same-origin проксирование API на gateway.
server {
    listen 8444 ssl;

    ssl_certificate     /etc/nginx/certs/frontend.crt;
    ssl_certificate_key /etc/nginx/certs/frontend.key;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API первого сервиса — через gateway
    location /movie-service/ {
        proxy_pass https://gateway:8443/movie-service/;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }

    # API второго сервиса — через gateway
    location /oscar/ {
        proxy_pass https://gateway:8443/oscar/;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }
}
