upstream api_gateways {
    zone api_gateways 128k;
    resolver discovery-dns:8053 valid=5s;
    resolver_timeout 3s;
    server discovery.internal service=gateway resolve;
}

log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';

proxy_set_header Host $http_host;
proxy_connect_timeout 3s;
proxy_ssl_name gateway;
proxy_ssl_server_name on;
proxy_redirect off;

server {
    listen 8444 ssl;
    access_log /var/log/nginx/access.log upstream;
    ssl_certificate     /etc/nginx/certs/frontend.crt;
    ssl_certificate_key /etc/nginx/certs/frontend.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(movie-service|oscar)/ {
        proxy_pass https://api_gateways;
    }
}

# Прямой вход в API использует тот же upstream и сертификат Gateway.
server {
    listen 8443 ssl;
    access_log /var/log/nginx/access.log upstream;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;

    location / {
        proxy_pass https://api_gateways;
    }
}
