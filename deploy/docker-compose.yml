name: soa-hoxton

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movie
      POSTGRES_USER: ${DB_USERNAME:-soa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-soa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d movie"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  config-server:
    build:
      context: ..
      dockerfile: deploy/config.Dockerfile
    environment:
      CONFIG_REPO_PATH: file:/config-repo
      _JAVA_OPTIONS: ${CONFIG_JAVA_OPTIONS:--Xmx128m -XX:MaxMetaspaceSize=160m}
    volumes:
      # Исходный config-repo монтируется read-only — конфиги не требуют пересборки образа.
      - ../config-server/src/main/resources/config-repo:/config-repo:ro
    ports:
      - "${CONFIG_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/movie-service/default"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases:
          - config
    restart: unless-stopped

  eureka-server:
    build:
      context: ..
      dockerfile: deploy/eureka.Dockerfile
    environment:
      EUREKA_HOSTNAME: eureka
      _JAVA_OPTIONS: ${EUREKA_JAVA_OPTIONS:--Xmx128m -XX:MaxMetaspaceSize=160m}
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8761/eureka/apps"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases:
          - eureka
    restart: unless-stopped

  movie:
    build:
      context: ..
      dockerfile: deploy/movie.Dockerfile
    environment:
      CONFIG_URL: http://config:8888
      EUREKA_URL: http://eureka:8761/eureka
      MOVIE_DB_URL: jdbc:postgresql://postgres:5432/movie
      MOVIE_DB_USERNAME: ${DB_USERNAME:-soa}
      MOVIE_DB_PASSWORD: ${DB_PASSWORD:-soa}
      MOVIE_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:8444}
      _JAVA_OPTIONS: ${MOVIE_JAVA_OPTIONS:--Xmx512m -XX:MaxMetaspaceSize=224m}
    # За gateway — наружу порт не публикуем.
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  oscar-1: &oscar
    build:
      context: ..
      dockerfile: deploy/oscar.Dockerfile
    environment:
      CONFIG_URL: http://config:8888
      EUREKA_URL: http://eureka:8761/eureka
      OSCAR_DB_URL: jdbc:postgresql://postgres:5432/oscar
      OSCAR_DB_USERNAME: ${DB_USERNAME:-soa}
      OSCAR_DB_PASSWORD: ${DB_PASSWORD:-soa}
      OSCAR_PORT: 8081
      INSTANCE_ID: 1
      MOVIE_SERVICE_PATH: /movie-service
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:8444}
      _JAVA_OPTIONS: ${OSCAR_JAVA_OPTIONS:--Xmx256m -XX:MaxMetaspaceSize=192m}
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  # environment при <<: не мерджится по-ключично — поэтому env дублируем явно.
  oscar-2:
    <<: *oscar
    environment:
      CONFIG_URL: http://config:8888
      EUREKA_URL: http://eureka:8761/eureka
      OSCAR_DB_URL: jdbc:postgresql://postgres:5432/oscar
      OSCAR_DB_USERNAME: ${DB_USERNAME:-soa}
      OSCAR_DB_PASSWORD: ${DB_PASSWORD:-soa}
      OSCAR_PORT: 8082
      INSTANCE_ID: 2
      MOVIE_SERVICE_PATH: /movie-service
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:8444}
      _JAVA_OPTIONS: ${OSCAR_JAVA_OPTIONS:--Xmx256m -XX:MaxMetaspaceSize=192m}

  eureka-dns:
    build: ./eureka-dns
    environment:
      EUREKA_URL: http://eureka:8761/eureka
    networks:
      default:
      discovery:
        aliases: [discovery-dns]
        ipv4_address: ${DISCOVERY_DNS_ADDRESS:-10.203.253.2}
    init: true
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  haproxy:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    networks: [default, discovery]
    depends_on:
      - eureka-dns
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka
      OSCAR_URL: http://haproxy:9090/oscar
      SSL_ENABLED: "true"
      EUREKA_INSTANCE_NON_SECURE_PORT_ENABLED: "false"
      KEYSTORE_PATH: /certs/gateway.p12
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-changeit}
      _JAVA_OPTIONS: ${GATEWAY_JAVA_OPTIONS:--Xmx320m -XX:MaxMetaspaceSize=128m}
    volumes:
      - ./certs:/certs:ro
    depends_on:
      eureka-server:
        condition: service_healthy
      haproxy:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${FRONTEND_PORT:-8444}:8444"
      - "${GATEWAY_PORT:-8443}:8443"
    networks: [default, discovery]
    depends_on:
      - eureka-dns
    restart: unless-stopped

networks:
  discovery:
    internal: true
    ipam:
      config:
        - subnet: ${DISCOVERY_DNS_SUBNET:-10.203.253.0/28}

volumes:
  pgdata:
