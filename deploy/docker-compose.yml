name: soa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movie
      POSTGRES_USER: ${DB_USERNAME:-soa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-soa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d movie"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  movie:
    build:
      context: ..
      dockerfile: deploy/movie.Dockerfile
    environment:
      MOVIE_DB_URL: jdbc:postgresql://postgres:5432/movie
      MOVIE_DB_USERNAME: ${DB_USERNAME:-soa}
      MOVIE_DB_PASSWORD: ${DB_PASSWORD:-soa}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:4173}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-changeit}
    volumes:
      - ./certs:/certs:ro
    ports:
      - "${MOVIE_PORT:-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  oscar:
    build:
      context: ..
      dockerfile: deploy/oscar.Dockerfile
    environment:
      OSCAR_DB_URL: jdbc:postgresql://postgres:5432/oscar
      OSCAR_DB_USERNAME: ${DB_USERNAME:-soa}
      OSCAR_DB_PASSWORD: ${DB_PASSWORD:-soa}
      MOVIE_SERVICE_URL: ${MOVIE_SERVICE_URL:-https://movie:8443/movie-service}
      MOVIE_SERVICE_TRUSTSTORE: ${MOVIE_SERVICE_TRUSTSTORE-/certs/movie-truststore.p12}
      MOVIE_SERVICE_TRUSTSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-changeit}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:4173}
      CATALINA_OPTS: -Dkeystore.password=${KEYSTORE_PASSWORD:-changeit}
    volumes:
      - ./certs:/certs:ro
    ports:
      - "${OSCAR_PORT:-8444}:8443"
    depends_on:
      postgres:
        condition: service_healthy
      movie:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
