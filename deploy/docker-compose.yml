name: soa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movie
      POSTGRES_USER: ${DB_USERNAME:-soa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-soa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d movie"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  movie:
    build:
      context: ..
      dockerfile: deploy/movie.Dockerfile
    environment:
      MOVIE_DB_URL: jdbc:postgresql://postgres:5432/movie
      MOVIE_DB_USERNAME: ${DB_USERNAME:-soa}
      MOVIE_DB_PASSWORD: ${DB_PASSWORD:-soa}
    ports:
      - "${MOVIE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  oscar:
    build:
      context: ..
      dockerfile: deploy/oscar.Dockerfile
    environment:
      OSCAR_DB_URL: jdbc:postgresql://postgres:5432/oscar
      OSCAR_DB_USERNAME: ${DB_USERNAME:-soa}
      OSCAR_DB_PASSWORD: ${DB_PASSWORD:-soa}
      MOVIE_SERVICE_URL: http://movie:8080/movie-service
    ports:
      - "${OSCAR_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      movie:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
